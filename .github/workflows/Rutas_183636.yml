name: Flujo MongoDB - Rutas (183636)

on:
  push:
    branches: [ "main", "feature/183636" ]
  workflow_dispatch:

jobs:
  # 1. Llamar ci.yml (arrancar MongoDB) según instrucción del pizarrón
  arrancar-mongo:
    uses: ./.github/workflows/ci.yml

  # 2. Leer archivos .json y crear colección
  cargar-rutas-mongo:
    needs: arrancar-mongo
    runs-on: ubuntu-latest

    # Failsafe: Aseguramos que MongoDB esté disponible en este job para la importación
    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017

    steps:
      - name: Descargar el repositorio (Checkout)
        uses: actions/checkout@v3

      - name: Instalar herramientas de MongoDB
        run: |
          sudo apt-get update
          sudo apt-get install -y mongo-tools

      - name: Leer JSONs y cargar eventos en colección Rutas
        run: |
          echo "Buscando archivos JSON en la carpeta Rutas..."
          for file in Rutas/*.json; do
            if [ -f "$file" ]; then
              echo "Procesando eventos de: $file"
              mongoimport --host localhost --port 27017 --db ERPSimulator --collection Rutas --file "$file" --jsonArray
            else
              echo "No se encontraron archivos JSON en la carpeta."
            fi
          done