name: Cargar eventos A/P en MongoDB - Diego 183657

on:
  push:
    branches:
      - 'proyecto/183657'
    paths:
      - 'AR&AP/eventos_ap.json'
      - '.github/workflows/mongo_183657.yml'
  workflow_dispatch:

jobs:
  cargar-eventos-ap:
    runs-on: ubuntu-latest
    
    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Esperar a que MongoDB esté listo
        run: |
          echo "Esperando a MongoDB..."
          sleep 10

      - name: Instalar mongo shell
        run: |
          sudo apt-get update
          sudo apt-get install -y mongodb-mongosh

      - name: Crear base de datos y colección ERP
        run: |
          mongosh mongodb://localhost:27017/erp_simulator --eval "
            db.createCollection('AP');
            print('Colección AP creada');
          "

      - name: Cargar eventos A/P en la colección AP
        run: |
          mongoimport --uri mongodb://localhost:27017/erp_simulator \
            --collection AP \
            --file "AR&AP/eventos_ap.json" \
            --jsonArray \
            --drop

      - name: Verificar carga de datos
        run: |
          mongosh mongodb://localhost:27017/erp_simulator --eval "
            print('Total de eventos en colección AP: ' + db.AP.countDocuments());
            db.AP.find().forEach(doc => print(JSON.stringify(doc)));
          "

      - name: Resumen de la carga
        run: |
          echo "Eventos del módulo A/P (Compras y Pagos) cargados exitosamente"
          echo "Colección: AP"
          echo "Base de datos: erp_simulator"
          echo "Alumno: Diego - Matrícula 183657"
